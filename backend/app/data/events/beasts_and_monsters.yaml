# Events built around what a species IS: packs, winters, appetites, ancient power.

- id: rival_pack
  title: The Rival Pack
  weight: 3
  once: true
  narrative: >
    The scent of a rival pack crosses your territory, strong and unfamiliar. The elders bristle, and everyone looks to the young ones.
  conditions:
    min_stage: adolescence
    max_stage: young_adult
    species_tags: [pack_animal]
  choices:
    - id: challenge
      text: Challenge their leader
      check: {stat: strength, difficulty: 55}
      success:
        result: You bring down their leader, and both packs turn to look at you differently.
        effects:
          - grant_trait: pack_alpha
          - stat_delta: {strength: 1}
          - axis_delta: {bravery: 6}
      failure:
        result: You are driven off, bloodied, but you live to try again.
        effects:
          - stat_delta: {constitution: -2}
          - axis_delta: {bravery: 3}
    - id: defend
      text: Stand with your pack elders
      result: You hold the line beside them.
      effects:
        - skill_xp: {command: 1.5}
        - axis_delta: {discipline: 4, sociability: 3}
    - id: leave
      text: Leave the pack and travel alone
      result: You turn your back on the pack and walk into the unknown.
      effects:
        - grant_trait: lone_wanderer
        - set_location: ancient_forest
        - axis_delta: {curiosity: 5, sociability: -6}

- id: harsh_winter
  title: A Hard Winter
  weight: 2
  narrative: >
    The snow comes early and does not leave. Prey is scarce, and everyone is hungry.
  conditions:
    min_stage: adolescence
    species_categories: [beast]
  choices:
    - id: endure
      text: Endure it and ration your strength
      check: {stat: constitution, difficulty: 50}
      success:
        result: You come through the winter thin, but with a stubborn calm you did not have before.
        effects:
          - skill_xp: {willpower: 2}
          - counter: {mental_trials: 1}
          - stat_delta: {constitution: 1}
      failure:
        result: The cold takes more from you than you can spare.
        effects:
          - stat_delta: {constitution: -3}
          - die: {cause: starvation}
            chance: 0.12
    - id: migrate
      text: Follow the herds south
      result: The journey is long, and you see more of the world than you ever expected.
      effects:
        - skill_xp: {exploration: 2}
        - set_location: ancient_forest
    - id: scavenge
      text: Scavenge near the villages
      check: {stat: dexterity, difficulty: 45}
      success:
        result: Careful and quick, you eat well on scraps no one will miss.
        effects:
          - skill_xp: {survival: 2}
      failure:
        result: A hunter's trap closes on your leg.
        effects:
          - stat_delta: {constitution: -2}
          - die: {cause: a hunter's trap}
            chance: 0.05

- id: absorb_the_fallen
  title: The Fallen Adventurer
  weight: 2
  narrative: >
    A body lies in the cavern, abandoned by its party. Its gear is still good, and you are very hungry.
  conditions:
    min_stage: adolescence
    species_tags: [amorphous]
  choices:
    - id: absorb
      text: Absorb everything
      result: You digest it all, flesh and steel alike. Something of its memories lingers in you.
      effects:
        - skill_xp: {soul_control: 2}
        - skill_xp: {alchemy: 1.5}
        - stat_delta: {strength: 1}
        - axis_delta: {good_evil: -6}
    - id: leave
      text: Leave the body and its gear alone
      result: You slide away. Not everything has to be food.
      effects:
        - axis_delta: {good_evil: 3}
    - id: bury
      text: Dissolve the body and bury the gear
      result: A quiet, tidy end. You feel unexpectedly dignified.
      effects:
        - axis_delta: {good_evil: 4, law_chaos: 2}
        - skill_xp: {alchemy: 1}

- id: dragon_hoard_urge
  title: The Hunger for Gold
  weight: 3
  once: true
  narrative: >
    A hunger without a name gnaws at you: an urge to gather bright and valuable things and keep them close.
  conditions:
    min_stage: adolescence
    species_tags: [draconic]
  choices:
    - id: hoard
      text: Begin a hoard
      result: The first gem is the hardest to part with. After that, it is easy.
      effects:
        - flag: hoard_started
        - grant_item: rough_gemstone
        - skill_xp: {draconic_mastery: 2}
        - axis_delta: {good_evil: -3}
    - id: share
      text: Give what you find away
      result: The urge fades into something warmer, a pride in what others do with your gifts.
      effects:
        - axis_delta: {good_evil: 5}
        - stat_delta: {charisma: 1}
    - id: master
      text: Master the urge
      result: You learn exactly how hungry you are, and how little it needs to rule you.
      effects:
        - skill_xp: {willpower: 3}
        - axis_delta: {discipline: 6}

- id: mana_spring
  title: A Spring of Raw Mana
  weight: 4
  once: true
  narrative: >
    Raw mana wells up from the earth here, bright as a second sunrise. It calls to something inside you.
  conditions:
    min_stage: adolescence
    species_categories: [monstrous]
    location_tags: [cavern, swamp, mountain_peak, mountain_hold]
  choices:
    - id: drink
      text: Drink deeply from the spring
      check: {stat: constitution, difficulty: 50}
      success:
        result: The power floods through you, and you hold it. You are changed.
        effects:
          - flag: touched_primal_source
          - skill_xp: {magic: 4}
          - stat_delta: {wisdom: 2, constitution: 1}
      failure:
        result: It burns through you like lightning, and you are still standing, barely.
        effects:
          - flag: touched_primal_source
          - stat_delta: {constitution: -3}
          - counter: {mental_trials: 1}
          - die: {cause: raw mana}
            chance: 0.04
    - id: sense
      text: Sense its source from a distance
      result: You learn to feel its currents without being burned by them.
      effects:
        - skill_xp: {concentration: 2}
        - axis_delta: {discipline: 3}
    - id: leave
      text: Leave it alone
      result: Some things are not meant to be touched.
