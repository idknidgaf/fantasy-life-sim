# Authored lore characters ("named" NPCs). Read by app/npc.py; validated by `python -m app.validate_content`.
#
# A named character has an AUTHORED name and id. Nothing about them is randomly generated, and they never take
# part in name generation. Every attribute but the identity is optional: leave out what the story does not need.
#
# characters:
#   - id: archmage_valen          lowercase letters, digits, underscores. Becomes the stable id "named_archmage_valen".
#     name: Valen of the Seventh Tower    the display name, exactly as written
#     species: elf                         must exist in species.yaml
#     age: 212
#     description: Keeper of the Seventh Tower.
#     stats: {strength: 30, dexterity: 45, constitution: 40, wisdom: 90, charisma: 60}     # all five, or omit
#     specialised_stats: {magic: 85}       swordsmanship | marksmanship | magic | martial_arts -> level
#     traits: [keen_mind]                  must exist in traits.yaml
#     talent: ...                          optional hidden talent id
#     status: active                       active | deceased | retired
#
# There are no named characters yet. Story integration is a later task.

characters: []
